              - listitem [ref=e154]: La CCSS garantiza atención prenatal gratuita para toda mujer embarazada sin importar si tiene seguro activo o no — es el primer paso de salud más urgente.
              - listitem [ref=e155]: El IMAS tiene como grupo prioritario explícito a mujeres embarazadas sin seguro médico, y puede certificar pobreza para que el Estado pague el seguro de la CCSS.
