            - list [ref=e160]:
              - listitem [ref=e161]: 1. Andá HOY al EBAIS más cercano a tu casa y decí que estás embarazada y sin seguro. La atención prenatal es gratis para toda mujer embarazada, con o sin seguro.
              - listitem [ref=e162]: 2. En el mismo EBAIS, preguntá cómo tramitar el seguro por cuenta del Estado — si califican según tu situación económica, el Estado paga la cuota.
              - listitem [ref=e163]: 3. Llamá al IMAS al 800-4627-800 para pedir una cita con un trabajador social. El IMAS tiene transferencias económicas para mujeres embarazadas sin seguro y familias en pobreza.
              - listitem [ref=e164]: 4. Si no podés llamar, andá directamente a la Oficina Local del IMAS de tu cantón con tu cédula y comprobante de domicilio.
              - listitem [ref=e165]: 5. Entrá a ane.cr (portal del MTSS) o llamá al MTSS para registrarte en la Agencia Nacional de Empleo — es gratis y conecta personas con empleadores.
              - listitem [ref=e166]: "6. Si en alguna institución no te atienden bien, llamá a la Defensoría de los Habitantes: 800-258-7474, gratis."
