<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1350px; background:#0d1117;
    font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif;
    color:#e6edf3; display:flex; flex-direction:column;
    padding:90px 80px; position:relative; overflow:hidden;
  }
  .topbar { position:absolute; top:0; left:0; right:0; height:12px;
    background:linear-gradient(90deg,#3fb950,#2ea043); }
  .kicker { font-size:26px; letter-spacing:6px; color:#3fb950; font-weight:700;
    margin-bottom:60px; text-transform:uppercase; }
  .vs { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .line1 { font-size:64px; font-weight:700; color:#8b949e; line-height:1.25; margin-bottom:24px; }
  q::before, q::after { content:""; }
  .line1 q { color:#d29922; font-style:italic; }
  .divider { display:flex; align-items:center; gap:24px; margin:40px 0; }
  .divider .rule { flex:1; height:1px; background:#30363d; }
  .divider .vs-label { font-size:28px; font-weight:800; color:#3fb950; letter-spacing:4px; }
  .line2 { font-size:72px; font-weight:800; line-height:1.2; }
  .line2 q { color:#3fb950; font-style:italic; }
  .punch { margin-top:70px; font-size:36px; color:#8b949e; line-height:1.4; }
  .punch b { color:#e6edf3; }
  .footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
  .name { font-size:24px; font-weight:700; }
  .name small { display:block; font-weight:400; font-size:19px; color:#8b949e; margin-top:4px; }
  .page { font-size:22px; color:#8b949e; }
</style>
</head>
<body>
  <div class="topbar"></div>
  <div class="kicker">The decision</div>
  <div class="vs">
    <div class="line1">Similarity search finds<br><q>&ldquo;probably relevant.&rdquo;</q></div>
    <div class="divider"><div class="rule"></div><div class="vs-label">VS</div><div class="rule"></div></div>
    <div class="line2">I needed<br><q>&ldquo;exactly this law —<br>or no answer.&rdquo;</q></div>
    <div class="punch"><b>Discipline beats recall</b> when the stakes are human.</div>
  </div>
  <div class="footer">
    <div class="name">Joseph Santamaría<small>QA &amp; AI Lead</small></div>
    <div class="page">3 / 7</div>
  </div>
</body>
</html>
